name: build-weather-ics

on:
  schedule:
    # 気象庁の発表（JST 5時・11時・17時）の直後に実行（cronはUTC表記）
    - cron: "40 20 * * *"  # JST 05:40
    - cron: "40 2 * * *"   # JST 11:40
    - cron: "40 8 * * *"   # JST 17:40
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ICS
        run: python scripts/build_weather.py
      - name: Validate ICS
        run: python scripts/validate_weather.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "update forecast"
            git push
          fi
